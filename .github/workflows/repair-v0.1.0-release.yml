name: repair-v0.1.0-release-metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-v0.1.0-release.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0 --repo clockcrockwork/novel-ci-core --notes "Immutable validator release. Integrity: sha256-1dc9e17c0319184922c80da8b04a97b5f35359a9434336cfdf5e6abfdefcf115"
